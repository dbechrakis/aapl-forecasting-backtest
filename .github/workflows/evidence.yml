name: Evidence checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:tests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff==0.16.9
      - name: Lint
        run: ruff check src scripts tests coursework --select E4,E7,E9,F
      - name: Validate committed evidence
        run: python ci/verify_evidence.py
      - name: Run tests (look-ahead, statistics, live scoring)
        run: python -m unittest discover -s tests -v
