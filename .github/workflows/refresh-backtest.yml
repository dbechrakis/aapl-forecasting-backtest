# Manually refresh the price snapshot and regenerate the backtest evidence.
name: Refresh backtest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence-writes
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/run_backtest.py
      - run: python ci/verify_evidence.py
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/raw/aapl_daily.csv outputs/backtest
          git diff --cached --quiet || git commit -m "Refresh AAPL snapshot and backtest evidence"
          git push
