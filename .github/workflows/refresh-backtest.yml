# Manually refresh the price snapshot and regenerate the backtest evidence.
name: Refresh backtest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence-writes
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/run_backtest.py
      - run: python ci/verify_evidence.py
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/raw/aapl_daily.csv outputs/backtest
          git diff --cached --quiet || git commit -m "Refresh AAPL snapshot and backtest evidence"
          git push
