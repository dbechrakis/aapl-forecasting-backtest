# Issue AAPL interval forecasts after each US close and score the ones that matured.
name: Live forecast
on:
  schedule:
    - cron: '17 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence-writes
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/forecast_latest.py
      - name: Commit forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/live
          git diff --cached --quiet || git commit -m "Live forecast $(date -u +%F)"
          git push
