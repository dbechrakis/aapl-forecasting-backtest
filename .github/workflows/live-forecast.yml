# Issue AAPL interval forecasts after each US close and score the ones that matured.
name: Live forecast
on:
  schedule:
    - cron: '17 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evidence-writes
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/forecast_latest.py
      - name: Commit forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/live
          git diff --cached --quiet || git commit -m "Live forecast $(date -u +%F)"
          git push
